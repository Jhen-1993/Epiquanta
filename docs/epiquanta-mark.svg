<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 72 72" width="72" height="72" class="epiquanta-mark" aria-hidden="true">
  <title>Epiquanta</title>
  <defs>
    <linearGradient id="eq-tile" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#273b67"/><stop offset="1" stop-color="#152641"/>
    </linearGradient>
    <linearGradient id="eq-ring" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#c5d0ff"/><stop offset=".58" stop-color="#91adff"/><stop offset="1" stop-color="#60e2cf"/>
    </linearGradient>
  </defs>
  <style>
    .eq-ring{stroke-dasharray:1;animation:eq-ring-in 1.5s cubic-bezier(.22,1,.36,1) both}
    .eq-trend{stroke-dasharray:1;animation:eq-trend-in 1.1s .45s ease both}
    .eq-node{transform-box:fill-box;transform-origin:center;animation:eq-node-in .65s ease both}
    .eq-n1{animation-delay:.7s}.eq-n2{animation-delay:.9s}.eq-n3{animation-delay:1.1s}.eq-n4{animation-delay:1.3s}
    .eq-spark{transform-box:fill-box;transform-origin:center;animation:eq-spark-in 1.4s 1.4s ease both}
    .epiquanta-brand:hover .eq-node,.epiquanta-mark:hover .eq-node{animation:eq-node-wave .8s ease 2;animation-delay:0s}
    .epiquanta-brand:hover .eq-n2,.epiquanta-mark:hover .eq-n2{animation-delay:.1s}
    .epiquanta-brand:hover .eq-n3,.epiquanta-mark:hover .eq-n3{animation-delay:.2s}
    .epiquanta-brand:hover .eq-n4,.epiquanta-mark:hover .eq-n4{animation-delay:.3s}
    @keyframes eq-ring-in{from{stroke-dashoffset:1;opacity:.2}to{stroke-dashoffset:0;opacity:1}}
    @keyframes eq-trend-in{from{stroke-dashoffset:1;opacity:0}to{stroke-dashoffset:0;opacity:1}}
    @keyframes eq-node-in{from{transform:scale(0);opacity:0}70%{transform:scale(1.25)}to{transform:scale(1);opacity:1}}
    @keyframes eq-node-wave{0%,100%{transform:scale(1)}50%{transform:scale(1.45)}}
    @keyframes eq-spark-in{from{opacity:0;transform:scale(.2) rotate(-45deg)}65%{opacity:1;transform:scale(1.25) rotate(0deg)}to{opacity:1;transform:scale(1) rotate(0deg)}}
    @media(prefers-reduced-motion:reduce){.epiquanta-mark *{animation:none!important}}
  </style>
  <rect x="1" y="1" width="70" height="70" rx="21" fill="url(#eq-tile)" stroke="#9fb9ff" stroke-opacity=".24"/>
  <circle class="eq-ring" pathLength="1" cx="34" cy="34" r="20" fill="none" stroke="url(#eq-ring)" stroke-width="4.5" transform="rotate(-90 34 34)"/>
  <path d="M47.5 48 57 57" fill="none" stroke="#60e2cf" stroke-width="5" stroke-linecap="round"/>
  <path class="eq-trend" pathLength="1" d="m21 39 9-10 9 7 9-12" fill="none" stroke="#78ead8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <g fill="#c0fff2">
    <circle class="eq-node eq-n1" cx="21" cy="39" r="2.6"/>
    <circle class="eq-node eq-n2" cx="30" cy="29" r="2.6"/>
    <circle class="eq-node eq-n3" cx="39" cy="36" r="2.6"/>
    <circle class="eq-node eq-n4" cx="48" cy="24" r="3"/>
  </g>
  <path class="eq-spark" d="m57 12 1.4 3.6L62 17l-3.6 1.4L57 22l-1.4-3.6L52 17l3.6-1.4Z" fill="#b8c8ff"/>
</svg>
